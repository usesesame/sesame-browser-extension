version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 ships no compiler API, so typescript-eslint and
      # svelte-check run on the TypeScript 6 API behind the typescript alias.
      # The native compiler is tracked separately as @typescript/native.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  # Every third-party action here is pinned to a full commit SHA. Dependabot is
  # the only thing that moves those pins, so this entry is a security control,
  # not convenience.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
