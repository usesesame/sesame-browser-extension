name: Store release packages

# Builds the Chrome, Edge, and experimental Firefox packages and their evidence.
# It deliberately does not upload to a store: supported packages are verified
# by hand in a clean profile before a person submits them.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    environment: store-release
    permissions:
      contents: read
    outputs:
      record-sha256: ${{ steps.record.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: npm ci

      - name: Require an exact source-version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "Release tag $GITHUB_REF does not match package version $version." >&2
            exit 1
          fi

      - name: Require the desktop contracts on main
        run: npm run compat:host

      - name: Run the contracts
        run: npm run governance:contract && npm run manifest:contract && npm run repro:contract && npm run audit:contract

      - name: Run the release gate and build the store packages
        run: npm run release:check

      - name: Run the host compatibility suite
        run: npm run test:compat

      - id: record
        name: Record the package record digest for the attestation job
        run: echo "sha256=$(sha256sum store-packages/store-release.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Record the package evidence
        run: |
          node -e '
            const record = require("./store-packages/store-release.json")
            const rows = record.packages.map((entry) => `| ${entry.browser} | ${entry.filename} | ${entry.files} | ${entry.bytes} | \`${entry.sha256}\` |`)
            console.log([
              `## Sesame extension ${record.version}`,
              "",
              `Native messaging protocol ${record.protocolVersion}, supported hosts ${record.hostCompatibility.minimumHostProtocolVersion} to ${record.hostCompatibility.currentHostProtocolVersion}.`,
              "",
              "| Browser | Package | Files | Bytes | SHA-256 |",
              "| --- | --- | --- | --- | --- |",
              ...rows,
              "",
              `SBOM: ${record.sbom.filename}, ${record.sbom.components} locked components.`,
              "",
              "Verify supported packages in a clean profile before uploading. Firefox remains experimental.",
            ].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Name the package artifact
        id: package-artifact
        run: echo "name=sesame-extension-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package-artifact.outputs.name }}
          path: store-packages
          if-no-files-found: error
          retention-days: 90

  browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: npm ci

      - name: Install the browser test runtime
        run: npx playwright-core install --with-deps chromium

      - name: Locate the browser test runtime
        run: |
          executable="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          echo "SESAME_BROWSER_TEST_EXECUTABLE=$executable" >> "$GITHUB_ENV"

      - name: Run the browser suite
        run: npm run test:browser

  attest:
    needs: [package, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Name the package artifact
        id: package-artifact
        run: echo "name=sesame-extension-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.package-artifact.outputs.name }}
          path: store-packages

      - name: Re-hash every package against the record the package job wrote
        env:
          EXPECTED_RECORD_SHA256: ${{ needs.package.outputs.record-sha256 }}
        run: |
          node -e '
            const { createHash } = require("node:crypto")
            const { readFileSync } = require("node:fs")
            const digest = (file) => createHash("sha256").update(readFileSync(file)).digest("hex")
            const expected = process.env.EXPECTED_RECORD_SHA256 ?? ""
            if (!/^[0-9a-f]{64}$/.test(expected) || digest("store-packages/store-release.json") !== expected) {
              throw new Error("The package record is not the one the package job wrote.")
            }
            const record = JSON.parse(readFileSync("store-packages/store-release.json", "utf8"))
            if (!Array.isArray(record.packages) || record.packages.length === 0) throw new Error("The package record lists no packages.")
            for (const entry of record.packages) {
              if (!/^[A-Za-z0-9._-]+\.zip$/.test(entry.filename)) throw new Error(`${entry.filename} is not a plain package filename.`)
              if (digest(`store-packages/${entry.filename}`) !== entry.sha256) throw new Error(`${entry.filename} is not the package the package job wrote.`)
            }
          '

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: store-packages/*.zip
