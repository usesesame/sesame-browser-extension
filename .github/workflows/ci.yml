name: Browser extension CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install the browser test runtime
        run: npx playwright-core install --with-deps chromium
      - name: Locate the browser test runtime
        run: |
          executable="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          echo "SESAME_BROWSER_TEST_EXECUTABLE=$executable" >> "$GITHUB_ENV"
      - run: npm run ci
