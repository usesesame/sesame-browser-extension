name: Host protocol compatibility

# A store release cannot be recalled the way a desktop build can, so the
# published extension has to keep working against hosts it did not ship with.
# This job watches the desktop-owned contract instead of waiting for a user to
# report that filling stopped working.

on:
  pull_request:
    paths:
      - 'contracts/browser/**'
      - 'src/protocol/**'
      - 'scripts/host-compatibility.mjs'
      - '.github/workflows/host-compatibility.yml'
  schedule:
    - cron: '17 6 * * 1-5'
  workflow_dispatch:
    inputs:
      ref:
        description: Desktop git ref to check against
        required: false
        default: main
  push:
    paths:
      - 'contracts/browser/**'
      - 'src/protocol/**'
      - 'scripts/host-compatibility.mjs'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Download the published desktop fixtures
        env:
          DESKTOP_REF: ${{ inputs.ref }}
          CHECK_CANDIDATE: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        run: |
          if [ -n "$DESKTOP_REF" ]; then
            node scripts/host-compatibility.mjs --ref "$DESKTOP_REF"
          elif [ "$CHECK_CANDIDATE" = 'true' ]; then
            node scripts/host-compatibility.mjs --candidate
          else
            node scripts/host-compatibility.mjs
          fi

      - name: Replay the published vectors through the extension validators
        run: npx vitest run tests/compat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: host-compatibility
          path: .host-compat
          retention-days: 14
